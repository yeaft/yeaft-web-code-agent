* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Global cursor/caret color fix */
input, textarea, [contenteditable] {
  caret-color: var(--text-primary);
}

/* ==============================
   Unified Select/Dropdown Styles
   ============================== */
select {
  font-family: inherit;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-input, var(--bg-main));
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 8px 32px 8px 12px;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

select:hover {
  border-color: var(--text-muted);
}

select:focus {
  outline: none;
  border-color: var(--accent-blue, #4a9eff);
  box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.12);
}

select option {
  background: var(--bg-main);
  color: var(--text-primary);
  padding: 8px 12px;
}

select option:checked {
  background: var(--sidebar-hover);
}

html {
  height: 100%;
  height: 100dvh;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg-main);
  color: var(--text-primary);
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  transition: background-color 0.2s, color 0.2s;
}

#app {
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}


/* Chat Page - Three Column Layout */
.chat-page {
  display: flex;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}

/* Left Sidebar - Sessions */
.session-sidebar-shell {
  width: var(--session-sidebar-width);
  min-width: var(--session-sidebar-width);
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s ease, min-width 0.2s ease;
  overflow: hidden;
}

.session-sidebar-shell.collapsed {
  width: 48px;
  min-width: 48px;
  border-right: 1px solid var(--border-color);
}

/* Sidebar / Workbench 分隔线 */
.sidebar-workbench-divider {
  width: 1px;
  background: var(--border-color);
  flex-shrink: 0;
}

/* Collapsed sidebar: hide everything except the icon bar */
.sidebar.collapsed .sidebar-top,
.sidebar.collapsed .session-list,
.sidebar.collapsed .session-tab-bar,
.sidebar.collapsed .session-panels,
.sidebar.collapsed .sidebar-bottom {
  display: none;
}

/* Unified and legacy lists belong to the expanded surface in both hosts.
   Outrank the legacy .yeaft-sidebar .us-scroll.us-scroll-flush layout rule. */
.session-sidebar-shell.collapsed > .sidebar-navigation,
.session-sidebar-shell.collapsed > .us-scroll.us-scroll-flush {
  display: none;
}

/* Collapsed Icon Bar */
.sidebar-collapsed-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
  width: 48px;
  height: 100%;
}

.collapsed-spacer {
  flex: 1;
}

.collapsed-icon-btn {
  position: relative;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
}

.collapsed-icon-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-primary);
}

.collapsed-icon-btn.active {
  background: var(--session-active);
  color: var(--accent-blue);
}

.collapsed-icon-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.collapsed-icon-btn svg {
  flex-shrink: 0;
}

.sidebar-top {
  padding: 12px 12px 8px;
}

/* Sidebar Header Row — Copilot style */
.sidebar-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0 8px;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  min-width: 0;
  white-space: nowrap;
}

.sidebar-brand .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-secondary);
  flex-shrink: 0;
}

.sidebar-brand .status-dot.online {
  background: var(--success);
}

.sidebar-brand .brand-label {
  white-space: nowrap;
}


/* Shared Agent dropdown used by both Session sidebars. */
.agent-header-controls {
  position: relative;
  min-width: 0;
}

.agent-dropdown-trigger {
  border: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.agent-dropdown-trigger:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 3px;
  border-radius: 2px;
}

.agent-update-notification {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  min-width: 22px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent-blue);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  flex-shrink: 0;
}

.agent-update-notification-count {
  font-variant-numeric: tabular-nums;
}

.dropdown-chevron {
  color: var(--text-secondary);
  transition: transform 0.2s;
  flex-shrink: 0;
}

.dropdown-chevron.open {
  transform: rotate(180deg);
}

.agent-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 8px;
  width: min(360px, calc(var(--session-sidebar-width) - 12px), calc(100vw - 12px));
  box-sizing: border-box;
  z-index: 100;
  overflow: hidden;
}

/* The Person Agent picker uses the same menu surface and row typography,
   including its teleported menu which cannot inherit from the trigger. */
.agent-dropdown,
.agent-select-menu.modern-select-menu {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  box-shadow: 0 12px 32px color-mix(in srgb, var(--text-primary) 14%, transparent);
  padding: 8px;
  font-family: var(--font-sans);
  font-size: 14px;
}

.agent-dropdown-list {
  max-height: min(420px, calc(100vh - 180px));
  overflow-y: auto;
}

.agent-dropdown-item {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) 50px 56px;
  align-items: center;
  column-gap: 8px;
}

.agent-dropdown-item,
.agent-select-menu .modern-select-option {
  min-height: 48px;
  padding: 8px 10px;
  border-radius: 10px;
  transition: background 0.15s;
  font-weight: 400;
}
.agent-select-menu .modern-select-option { display: flex; align-items: center; padding-right: 28px; }
.agent-select-menu .modern-select-option-main { width: 100%; }
.agent-select-menu .modern-select-list { padding: 0; }

.agent-dropdown-item:hover,
.agent-select-menu .modern-select-option:hover,
.agent-select-menu .modern-select-option.is-active {
  background: var(--sidebar-hover);
}

.agent-dropdown-item .status-dot.restarting,
.agent-dropdown-item .status-dot.upgrading {
  background: var(--accent-blue);
  animation: pulse 1.5s ease-in-out infinite;
}

.agent-dropdown-name,
.agent-select-menu .modern-select-option-label {
  min-width: 0;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-dropdown-meta {
  display: block;
  min-width: 0;
  text-align: left;
}

.agent-dropdown-version {
  display: block;
  white-space: nowrap;
  font-size: 9px;
  color: var(--text-muted);
  font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
  font-variant-numeric: tabular-nums;
}

.agent-dropdown-update-version {
  color: var(--accent-blue);
  font-weight: 700;
}

.agent-dropdown-status {
  font-size: 10px;
  color: var(--accent-blue);
  font-style: italic;
  white-space: nowrap;
}

.agent-dropdown-actions {
  display: inline-flex;
  align-items: center;
  justify-self: end;
  gap: 0;
}

.agent-dropdown-action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  flex-shrink: 0;
  cursor: pointer;
}

.agent-dropdown-action-btn:hover:not(:disabled),
.agent-dropdown-action-btn:focus-visible:not(:disabled) {
  background: var(--sidebar-hover);
  color: var(--accent-blue);
  outline: none;
}

.agent-dropdown-action-btn:focus-visible {
  box-shadow: 0 0 0 2px var(--accent-blue);
}

.agent-dropdown-action-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.agent-dropdown-upgrade-btn.update-available:not(:disabled) {
  background: var(--accent-bg);
  color: var(--accent-blue);
}

.agent-dropdown-empty {
  padding: 10px;
  color: var(--text-muted);
  font-size: 13px;
}

.agent-dropdown-footer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px;
}

.agent-dropdown-settings-option {
  width: 100%;
  min-width: 0;
  border: 0;
  padding: 7px 10px 7px 26px;
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  text-align: left;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  line-height: 20px;
  cursor: pointer;
}

.agent-dropdown-settings-option:hover:not(:disabled),
.agent-dropdown-settings-option:focus-visible:not(:disabled) {
  background: var(--sidebar-hover);
  outline: none;
}

.agent-dropdown-settings-option:focus-visible {
  box-shadow: 0 0 0 2px var(--accent-blue);
}

.agent-dropdown-settings-option:disabled {
  color: var(--text-muted);
  cursor: not-allowed;
  opacity: 0.65;
}

.agent-dropdown-upgrade-all-option {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: auto;
  padding-left: 10px;
  white-space: nowrap;
}

.agent-dropdown-upgrade-all-spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border-color);
  border-top-color: var(--accent-blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.sidebar-header-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.sidebar-icon-btn {
  position: relative;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
}

.sidebar-icon-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-primary);
}

.sidebar-icon-btn.active {
  background: var(--session-active);
  color: var(--accent-blue);
}

.sidebar-icon-btn svg {
  flex-shrink: 0;
}

/* Plain iOS-style switch for the Chat ↔ Yeaft sidebar mode flip.
   Off = neutral track + thumb on the left. On = accent-filled track +
   thumb slid to the right. No internal icons or labels — the title
   attribute carries the meaning. */
.mode-toggle {
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  height: 24px;
  border-radius: 999px;
}
.mode-toggle:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
}
.mode-toggle.disabled,
.mode-toggle[disabled] {
  cursor: not-allowed;
  opacity: 0.45;
}
.mode-toggle-track {
  position: relative;
  width: 36px;
  height: 20px;
  border-radius: 999px;
  background: var(--bg-input-wrapper);
  border: 1px solid var(--border-color);
  transition: background 0.15s, border-color 0.15s;
}
.mode-toggle-thumb {
  position: absolute;
  top: 1px;
  left: 1px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform 0.18s ease, background 0.15s;
}
/* On state: keep the track theme-neutral; the thumb position carries the state.
   Slide distance = track width (36) - thumb width (16) - 2x 1px border - 2x 1px inset = 16px. */
.mode-toggle.is-yeaft .mode-toggle-track {
  background: var(--session-active);
  border-color: var(--border-color);
}
.mode-toggle.is-yeaft .mode-toggle-thumb {
  background: var(--text-primary);
  transform: translateX(16px);
}
.mode-toggle:not(.disabled):not(.is-yeaft):hover .mode-toggle-track {
  background: var(--sidebar-hover);
}

/* Sidebar Nav Menu — Copilot style menu items */
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 0 8px;
}

.sidebar-nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.sidebar-nav-item:hover {
  background: var(--sidebar-hover);
}

.sidebar-nav-item:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.sidebar-nav-item svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  flex-shrink: 0;
  color: var(--text-secondary);
}

.sidebar-nav-item:hover svg {
  color: var(--text-primary);
}

/* Agent Selector at Top */
.agent-selector {
  position: relative;
  margin-bottom: 8px;
}

.agent-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.agent-btn:hover {
  background: var(--sidebar-hover);
}

.agent-btn .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-secondary);
  flex-shrink: 0;
}

.agent-btn .status-dot.online {
  background: var(--success);
}

.agent-btn .agent-name {
  flex: 1;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.agent-btn .chevron {
  width: 16px;
  height: 16px;
  fill: var(--text-secondary);
  transition: transform 0.2s;
  flex-shrink: 0;
}

.agent-btn .chevron.rotated {
  transform: rotate(180deg);
}

/* Dropdown */
.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 4px;
  background: var(--bg-main);
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  z-index: 100;
  max-height: 300px;
  overflow-y: auto;
  padding: 4px;
}

.agent-item {
  padding: 10px 12px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
}

.agent-item:hover {
  background: var(--sidebar-hover);
}

.agent-item.selected {
  background: var(--session-active);
}

.agent-item.no-agents {
  color: var(--text-secondary);
  cursor: default;
  text-align: center;
}

.agent-item .name {
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.agent-item .info {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
  margin-left: 16px;
}

.agent-item .status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
}

.agent-item .status.online {
  background: var(--success);
}

/* New Chat Button */
.new-chat-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
}

.new-chat-btn:hover {
  background: var(--sidebar-hover);
}

.new-chat-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Session List (legacy, kept for collapsed compat) */
.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px;
}

/* Unified navigation: primary destinations stay above the scrolling sessions. */
.sidebar-navigation {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.sidebar-session-toolbar {
  display: flex;
  align-items: center;
  min-height: 38px;
  padding: 0 10px 6px 14px;
}

.sidebar-session-title {
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
}

.sidebar-session-count {
  margin-left: 6px;
  color: var(--text-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sidebar-toolbar-spacer {
  flex: 1;
}

.sidebar-tool-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
}

.sidebar-tool-button:hover:not(:disabled),
.sidebar-tool-button.active {
  background: var(--sidebar-hover);
  color: var(--text-primary);
}

.sidebar-tool-button:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: -2px;
}

.sidebar-tool-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.sidebar-tool-button svg {
  width: 16px;
  height: 16px;
}

.sidebar-session-results {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding-bottom: 12px;
}

/* Session Tab Bar */
.session-tab-bar {
  display: flex;
  padding: 0 8px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}

.session-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px 4px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  user-select: none;
}

.session-tab:hover {
  color: var(--text-primary);
}

.session-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent-blue);
}

.session-tab-icon {
  opacity: 0.6;
  flex-shrink: 0;
}

.session-tab.active .session-tab-icon {
  opacity: 1;
}

/* Single-tab variant (used by Yeaft sidebar, and by Chat sidebar when
   The bar spans full width and
   drops the active underline + bottom divider — there's nothing to
   pick between, so the selection affordance only adds noise. */
.session-tab-bar:has(> .session-tab-solo) {
  border-bottom: none;
}
.session-tab.session-tab-solo {
  flex: 1 1 auto;
  justify-content: flex-start;
  gap: 12px;
  padding: 16px 16px 14px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.session-tab.session-tab-solo.active {
  border-bottom-color: transparent;
}
.session-tab.session-tab-solo .session-tab-icon {
  width: 16px;
  height: 16px;
  opacity: 0.85;
}
.session-tab.session-tab-solo .session-tab-count {
  margin-left: 2px;
  font-size: 12px;
  padding: 2px 8px;
}
.session-tab.session-tab-solo .session-tab-add-btn {
  margin-left: auto;
  width: 26px;
  height: 26px;
  opacity: 1;
}
.session-tab.session-tab-solo .session-tab-add-btn svg {
  width: 16px;
  height: 16px;
}
/* feat-yeaft-session-restore: when both Create + Restore action buttons
   sit in the same tab header, only the first (Create) grabs the auto
   margin — subsequent buttons sit flush next to it with a small gap. */
.session-tab.session-tab-solo .session-tab-add-btn + .session-tab-add-btn {
  margin-left: 4px;
}

.session-tab-count {
  font-size: 11px;
  background: rgba(255,255,255,0.08);
  color: var(--text-secondary);
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 400;
  line-height: 1.3;
}

.session-tab.active .session-tab-count {
  background: rgba(88,166,255,0.15);
  color: var(--accent-blue);
}

.session-tab-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}

.session-tab:hover .session-tab-add-btn,
.session-tab.active .session-tab-add-btn {
  opacity: 0.7;
}

.session-tab-add-btn:hover {
  opacity: 1 !important;
  background: var(--bg-hover);
  color: var(--accent-blue);
}

.session-tab-add-btn.disabled {
  opacity: 0 !important;
  cursor: not-allowed;
}

/* Session Panels — adaptive layout */
.session-panels {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
}

.session-panel {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
}

.session-panel-list {
  padding: 0 8px;
}

/* Add button in group header, right-aligned */
.session-header-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  opacity: 0;
  flex-shrink: 0;
  transition: opacity 0.15s, background 0.15s;
}

.session-header-add-btn.disabled {
  opacity: 0 !important;
  cursor: not-allowed;
}

.session-group-header:hover .session-header-add-btn:not(.disabled) {
  opacity: 0.7;
}

.session-header-add-btn:hover:not(.disabled) {
  opacity: 1 !important;
  background: var(--bg-hover);
}

.session-group-title {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 16px 12px 8px;
  font-weight: 500;
}

/* 会话分组标题 */
.session-group-header {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 8px 6px 12px;
  margin: 0 8px;
  margin-top: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
  border-radius: 6px;
  transition: background 0.15s;
}

.session-group-header:hover {
  background: var(--sidebar-hover);
}

.session-group-title-area {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  cursor: pointer;
  min-width: 0;
}

.session-collapse-arrow {
  flex-shrink: 0;
  opacity: 0.6;
  transition: transform 0.2s ease;
}

.session-collapse-arrow.collapsed {
  transform: rotate(-90deg);
}

.session-panel.collapsed {
  flex: 0 0 auto !important;
  min-height: auto !important;
  overflow: visible !important;
}

.session-group-header .session-group-icon {
  opacity: 0.9;
}

.session-item {
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 1px;
}

.session-item:hover {
  background: var(--sidebar-hover);
}

.session-item.active {
  background: var(--session-active);
}

.session-item.processing .title {
  color: var(--text-secondary);
}

.session-item.agent-offline {
  opacity: 0.45;
}

.session-item.agent-offline:hover {
  opacity: 0.6;
}

.processing-dot,
.unread-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  flex-shrink: 0;
}

.processing-dot {
  background: var(--text-secondary);
  animation: pulse 1.5s ease-in-out infinite;
  flex-shrink: 0;
}

.session-item-header > .processing-dot {
  margin-right: 0;
}

.unread-dot {
  background: var(--success);
}

.pane-active-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 6px;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.session-item .title {
  font-size: 14px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.session-item-header {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.session-item-header .title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-item-main {
  display: block;
  min-width: 0;
  width: 100%;
}

.session-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

/* Session pin icon — small indicator before title for pinned items */
.session-pin-icon {
  flex-shrink: 0;
  width: 12px;
  height: 12px;
  color: var(--text-muted);
}

.session-pin-icon svg {
  width: 12px;
  height: 12px;
  fill: currentColor;
  display: block;
}

/* Session dots button — horizontal menu trigger */
.session-dots-btn {
  width: 24px;
  height: 24px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.session-item:hover .session-dots-btn,
.session-dots-btn.menu-open {
  opacity: 1;
}

.session-dots-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-primary);
}

.session-dots-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

/* Session dropdown menu — positioned below dots button */
.session-menu {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 4px;
  min-width: 160px;
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  z-index: 200;
  padding: 4px;
  animation: fadeSlideDown 0.12s ease-out;
}

.session-menu.session-menu-floating {
  position: fixed;
  right: auto;
  margin-top: 0;
  min-width: 0;
  overflow-y: auto;
  z-index: 1000;
}

.session-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background 0.12s;
}

.session-menu-item:hover {
  background: var(--sidebar-hover);
}

.session-menu-parent {
  justify-content: space-between;
}

.session-menu-parent.active {
  background: var(--sidebar-hover);
}

.session-submenu {
  overflow-y: auto;
}

.session-menu-empty {
  padding: 8px 12px;
  color: var(--text-muted);
  font-size: 12px;
}

.session-menu-item svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
  flex-shrink: 0;
  color: var(--text-secondary);
}

.session-menu-item.danger {
  color: var(--error);
}

.session-menu-item.danger svg {
  color: var(--error);
}

/* PaneTopBar pin icon for pinned items */
.ptb-pin-icon {
  flex-shrink: 0;
  color: var(--accent-blue, #4a9eff);
  margin-right: 2px;
}

/* Chat session inline rename input */
.chat-rename-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--accent-blue, #3b82f6);
  outline: none;
  color: var(--text-primary);
  font-size: inherit;
  font-family: inherit;
  padding: 0 0 1px;
  margin: 0;
  line-height: inherit;
}

.chat-rename-input::selection {
  background: var(--accent-blue, #3b82f6);
  color: white;
}

.session-info {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 1px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  min-width: 0;
  overflow: hidden;
}

.session-path {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-time {
  flex-shrink: 0;
  color: var(--text-muted);
  font-size: 11px;
}

.session-agent,
.session-provider,
.session-availability {
  flex-shrink: 0;
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--text-secondary);
  background: var(--bg-input-wrapper);
  font-size: 10px;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-availability {
  color: var(--text-muted);
}

.new-chat-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.empty-hint {
  padding: 16px 12px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
}

/* Sidebar Action Bar */
.sidebar-action-bar {
  display: flex;
  gap: 4px;
  padding: 4px 12px 8px;
}

.sidebar-action-btn {
  position: relative;
  width: 36px;
  height: 32px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: background 0.15s;
}

.sidebar-action-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-primary);
}

.sidebar-action-btn.active {
  background: var(--session-active);
  color: var(--accent-blue);
}

.sidebar-action-btn svg {
  flex-shrink: 0;
}

.action-badge {
  position: absolute;
  top: 1px;
  right: 1px;
  min-width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  background: var(--accent-blue);
  color: white;
  font-size: 9px;
  font-weight: 600;
  border-radius: 7px;
  line-height: 1;
}

/* Sidebar Bottom — single row: settings left, version right */
.sidebar-bottom {
  padding: 4px 12px 8px;
}

.sidebar-bottom .sidebar-nav-item {
  justify-content: flex-start;
}

.sidebar-version {
  font-size: 11px;
  color: var(--text-secondary);
  opacity: 0.5;
  margin-left: auto;
}

.sidebar-menu-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
}

.sidebar-menu-btn:hover {
  background: var(--sidebar-hover);
}

.sidebar-menu-btn svg {
  width: 18px;
  height: 18px;
}

/* Main Chat Area */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* When workbench is open, chat area narrows */
.main-content.workbench-active {
  flex: 1;
  min-width: 0;
}

/* When the right-side workbench is maximized, hide only the conversation
   column; the panel itself is now a child of main-content. */
.main-content.workbench-maximized > .chat-header,
.main-content.workbench-maximized > .chat-body > .chat-body-main,
.main-content.workbench-maximized > .chat-body > .expert-panel,
.main-content.workbench-maximized > .chat-body > .subagent-panel {
  display: none !important;
}

/* Chat Header */
/* task-329: flex-shrink:0 defensively prevents flex parent from compressing
   header; paired with mobile rule inside chat-modals.css. */
.chat-header {
  display: flex;
  justify-content: center;
  padding: 8px 24px 4px;
  background: var(--bg-main);
  position: relative;
  box-sizing: border-box;
  flex-shrink: 0;
}

.header-right {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-action-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.header-action-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.header-action-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.header-action-btn svg {
  display: block;
}

/* Button loading state: replace icon with spinner */
.header-action-btn.btn-loading {
  pointer-events: none;
  opacity: 0.7;
}

.header-action-btn.btn-loading svg {
  display: none;
}

.header-action-btn.btn-loading::after {
  content: '';
  width: 14px;
  height: 14px;
  border: 2px solid var(--text-tertiary, #666);
  border-top-color: var(--accent-blue, #3b82f6);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* Compact Status Banner */
.compact-status-banner {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  z-index: 10;
  animation: slideDown 0.2s ease-out;
  white-space: nowrap;
}

.compact-status-banner.compacting {
  background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}

.compact-status-banner.completed {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
  animation: slideDown 0.2s ease-out, fadeOut 0.3s ease-out 2.7s forwards;
}

.compact-spinner {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.compact-icon {
  flex-shrink: 0;
}

.compact-message {
  line-height: 1.2;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

@keyframes fadeOut {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

.chat-title-group {
  flex: 1 1 auto;
  min-width: 0;
  max-width: 50%;
  text-align: center;
  overflow: hidden;
}

.chat-title {
  font-size: 14px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-title-path {
  display: flex;
  align-items: center;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-secondary);
  opacity: 0.7;
  overflow: hidden;
  white-space: nowrap;
}

.chat-title-path-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.chat-title-agent {
  display: inline-block;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
  margin-right: 6px;
  font-weight: 500;
  white-space: nowrap;
}

.header-left {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

/* Header icon button (sidebar toggle, refresh, workbench toggle) */
.header-icon-btn {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  color: var(--text-secondary);
  position: relative;
  flex-shrink: 0;
}

.header-icon-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-primary);
}

.header-icon-btn.active {
  background: var(--session-active);
  color: var(--accent-blue);
}

.header-icon-btn.active svg {
  fill: var(--accent-blue);
}

.header-icon-btn svg {
  fill: currentColor;
}

.header-btn-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  background: var(--accent-blue);
  color: white;
  font-size: 10px;
  font-weight: 600;
  border-radius: 8px;
  line-height: 1;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  color: var(--text-primary);
}

.icon-btn:hover {
  background: var(--sidebar-hover);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Chat Container */
.virtual-transcript-scroller {
  /* Only virtual transcripts own anchor compensation and tail follow. */
  overflow-anchor: none;
}

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  background: var(--bg-main);
  min-height: 0;
  position: relative;
}

/* Welcome Screen */
.welcome-screen {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;

.welcome-setup {

.welcome-actions {

.welcome-btn {

  justify-content: center;

.welcome-btn:hover {

.welcome-btn.primary {

}

@media (max-width: 560px) {

.messages {

}

/* Load More Button */
.load-more-top {
  text-align: center;
  padding: 8px 0 16px;
}

.load-more-btn {
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  background: var(--bg-sidebar);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;

}

.load-more-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-primary);
  border-color: var(--text-secondary);

/* Messages */
.virtual-transcript {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.virtual-transcript-spacer {
  flex: 0 0 auto;
}

.virtual-transcript-window {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.virtual-transcript-item {
  display: flex;
  flex-direction: column;
  min-width: 0;
  contain: layout paint;
}

.message-block {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.msg-row {
  display: flex;
  flex-direction: column;
}

.message {
  line-height: 1.6;
  word-wrap: break-word;
  font-size: 15px;
}

.message.user {
  align-self: flex-end;
  margin-left: auto;
  max-width: 80%;
  font-size: 15px;
  position: relative;
}

.message-user-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin: 0 8px 5px;
  color: var(--text-muted);
  font-size: 11px;
  line-height: 1.3;
  user-select: none;
  white-space: nowrap;
}

.message-user-author {
  color: var(--text-secondary);
  font-weight: 600;
}

.message-user-meta-separator {
  color: var(--text-muted);
}

.message-user-meta .message-time {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.message-user-block {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 16px 8px;
  border-radius: 18px;
  background: var(--bg-user-msg-subtle);
}

.message-user-attachments,
.message-user-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 4px 6px;
}

.message-user-attachments {
  margin-top: 5px;
}

.message-user-actions {
  min-height: 23px;
  margin: 2px 8px 0;
  opacity: 0;
  transition: opacity 0.15s;
}

.message.user:hover .message-user-actions,
.message.user:focus-within .message-user-actions {
  opacity: 1;
}

.message-action-btn {
  display: inline-flex;
  width: 24px;
  height: 24px;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font: inherit;
  font-size: 11px;
}

.message-action-btn:hover,
.message-action-btn:focus-visible {
  background: var(--sidebar-hover);
  color: var(--text-primary);
  outline: none;
}

.message-quoted-context {
  margin-bottom: 8px;
  padding: 7px 9px;
  border-left: 2px solid var(--border-color);
  border-radius: 4px;
  background: var(--bg-input-wrapper);
  color: var(--text-secondary);
}

.message-quoted-author {
  margin-bottom: 2px;
  font-size: 11px;
  font-weight: 600;
}

.message-quoted-content {
  display: -webkit-box;
  overflow: hidden;
  font-size: 12px;
  line-height: 1.4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.message-quoted-todos {
  margin-top: 4px;
  display: grid;
  gap: 2px;
  font-size: 11px;
}

.message-quoted-todo {
  display: flex;
  gap: 5px;
}

.message.system {
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  padding: 8px 16px;
  background: transparent;

}

.message.error {
  text-align: center;
  font-size: 13px;
  color: var(--error);
  padding: 10px 16px;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: 8px;
  align-self: center;
}

/* ============================================
   MCP Config Dropdown (ChatHeader)
   ============================================ */

.mcp-config-wrapper {
  position: relative;
}

.header-action-btn.active {
  background: var(--bg-hover);
  color: var(--accent-blue, #3b82f6);
}

.mcp-count-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 7px;
  background: var(--accent-blue, #3b82f6);
  color: #fff;
  font-size: 9px;
  font-weight: 600;
  line-height: 14px;
  text-align: center;
  pointer-events: none;
}

.mcp-dropdown {
  position: fixed;
  width: 280px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  z-index: 1000;
  animation: fadeSlideDown 0.15s ease-out;
}

@keyframes fadeSlideDown {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.mcp-dropdown-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border-color);
}

.mcp-dropdown-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.mcp-dropdown-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
}

.mcp-dropdown-close:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.mcp-dropdown-body {
  padding: 6px 0;
  max-height: 240px;
  overflow-y: auto;
}

.mcp-server-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
}

.mcp-server-name {
  flex: 1;
  font-size: 13px;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mcp-server-badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 500;
  flex-shrink: 0;
}

.mcp-badge-builtin {
  background: rgba(59, 130, 246, 0.12);
  color: var(--accent-blue, #3b82f6);
}

.mcp-badge-mcp {
  background: rgba(168, 85, 247, 0.12);
  color: #a855f7;
}

.mcp-toggle {
  position: relative;
  width: 32px;
  height: 18px;
  border: none;
  border-radius: 9px;
  background: var(--bg-tertiary, #444);
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}

.mcp-toggle.active {
  background: var(--accent-blue, #3b82f6);
}

.mcp-toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}

.mcp-toggle.active .mcp-toggle-knob {
  transform: translateX(14px);
}

.mcp-dropdown-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--border-color);
}

.mcp-restart-hint {
  font-size: 11px;
  color: var(--warning, #f59e0b);
}

/* Mobile: wider horizontal padding for message area */
@media (max-width: 768px) {
  .chat-container {
    padding: 16px 12px;
  }

  .chat-container > .messages {
    max-width: 90%;
  }
}


/* ===========================================================================
   YeaftSidebar
   The session list reuses .session-* classes from sidebar.css for parity with
   the Chat sidebar. Only the header row, scroll wrapper, and bottom
   nav overrides live here — everything else is shared.
   No horizontal dividers — groups separated by padding only.
   =========================================================================== */

.yeaft-sidebar {
  height: 100%;
  color: var(--text-primary, #1d1d1f);
  font-size: 14px;
}

/* Scroll area -------------------------------------------------------------- */
.us-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 4px 8px 16px 8px;
}

/* Parity variant: strip padding so .session-tab-bar / .session-panel-list
   sit edge-to-edge, matching the Chat sidebar. */
.yeaft-sidebar .us-scroll.us-scroll-flush {
  padding: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.yeaft-sidebar .session-empty-hint {
  padding: 24px 8px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

.yeaft-sidebar .yeaft-session-draggable {
  user-select: none;
}

.yeaft-sidebar .yeaft-session-draggable.dragging {
  opacity: 0.55;
}

.yeaft-sidebar .yeaft-session-draggable.drag-over {
  background: var(--sidebar-hover);
  box-shadow: inset 3px 0 0 var(--accent-blue);
}

/* Mobile slide-away behavior. Width is owned exclusively by the shared
   SessionSidebarShell token so Chat and Yeaft stay identical. */
/* Codex-style unified navigation: Projects group Yeaft Sessions; Recents keeps all providers. */
.sidebar-primary-actions { display: flex; flex: 0 0 auto; flex-direction: column; padding: 6px 8px 4px; }
.sidebar-primary-action { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text-primary); font: inherit; font-size: 14px; line-height: 20px; cursor: pointer; text-align: left; }
.sidebar-primary-action:hover:not(:disabled), .sidebar-project-header:hover, .sidebar-project-header.drag-over, .recents-section.drag-over { background: var(--sidebar-hover); }
.sidebar-primary-action:disabled { cursor: not-allowed; color: var(--text-muted); }
.sidebar-catalog-loading { display: flex; align-items: center; gap: 8px; }
.sidebar-primary-action:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: -2px; }
.sidebar-primary-action-icon { display: block; width: 18px; height: 18px; flex: 0 0 auto; color: var(--text-secondary); }
.sidebar-project-add-button { opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
.sidebar-project-add-button .sidebar-project-add-icon { width: 16px; height: 16px; }
.sidebar-section-heading > .sidebar-project-add-button:disabled { opacity: 0; pointer-events: none; }
.sidebar-section-heading:hover > .sidebar-project-add-button:not(:disabled),
.sidebar-section-heading > .sidebar-project-add-button:not(:disabled):focus-visible { opacity: 1; pointer-events: auto; }
.sidebar-section { padding: 0 8px 10px; }
.sidebar-session-results { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.projects-section { flex: 0 0 auto; max-height: 50%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.recents-section { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.sidebar-section + .sidebar-section { margin-top: 0; }
.sidebar-section-heading { display: flex; align-items: center; min-height: 38px; padding: var(--sidebar-section-heading-padding); color: var(--text-muted); font-size: 14px; font-weight: 600; }
.projects-section > .sidebar-section-heading, .recents-section > .sidebar-section-heading { position: sticky; top: 0; z-index: 1; background: var(--bg-sidebar); }
.sidebar-section-toggle { display: flex; align-items: center; gap: var(--sidebar-section-toggle-gap); flex: 0 1 auto; min-width: 0; min-height: var(--sidebar-section-toggle-height); padding: var(--sidebar-section-toggle-padding); border: 0; border-radius: var(--sidebar-section-toggle-radius); background: transparent; color: inherit; font: inherit; cursor: pointer; text-align: left; }
.sidebar-section-toggle:hover { color: var(--text-secondary); }
.sidebar-section-toggle:focus-visible { outline: var(--sidebar-focus-ring-width) solid var(--accent-blue); outline-offset: var(--sidebar-focus-ring-offset); }
.sidebar-section-chevron { width: var(--sidebar-section-chevron-size); height: var(--sidebar-section-chevron-size); flex: 0 0 auto; opacity: 0; pointer-events: none; transition: opacity 0.12s ease, transform 0.15s ease; }
.sidebar-section-heading:hover .sidebar-section-chevron,
.sidebar-section-toggle:focus-visible .sidebar-section-chevron { opacity: 1; pointer-events: auto; }
@media (pointer: coarse) {
  .sidebar-project-add-button:not(:disabled), .sidebar-section-chevron { opacity: 1; pointer-events: auto; }
}
.sidebar-section-chevron.collapsed { transform: rotate(-90deg); }
.sidebar-section.is-collapsed { flex: 0 0 auto; max-height: none; overflow: visible; padding-bottom: 0; }
.sidebar-recents-create { opacity: 0; pointer-events: none; transition: opacity 0.12s ease; }
.recents-section > .sidebar-section-heading:hover > .sidebar-recents-create,
.recents-section > .sidebar-section-heading > .sidebar-recents-create:focus-visible { opacity: 1; pointer-events: auto; }
@media (pointer: coarse) {
  .sidebar-recents-create { opacity: 1; pointer-events: auto; }
}
.sidebar-section-empty { padding: 8px 10px 12px; color: var(--text-muted); font-size: 12px; }
.sidebar-project, .sidebar-project-header { position: relative; }
.sidebar-project-header { display: flex; align-items: center; border-radius: 8px; }
.sidebar-project-header[draggable="true"] { cursor: grab; user-select: none; }
.sidebar-project-header[draggable="true"]:active { cursor: grabbing; }
.sidebar-project-header.dragging { opacity: 0.55; }
.sidebar-project-header.project-drag-before { box-shadow: inset 0 var(--sidebar-drag-indicator-width) 0 var(--accent-blue); }
.sidebar-project-header.project-drag-after { box-shadow: inset 0 calc(-1 * var(--sidebar-drag-indicator-width)) 0 var(--accent-blue); }
.sidebar-project-toggle { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; min-height: 34px; padding: 0 4px; border: 0; background: transparent; color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
.sidebar-project-name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-project-icon { width: var(--sidebar-project-icon-width); height: var(--sidebar-project-icon-height); flex: 0 0 auto; color: var(--text-secondary); }
.sidebar-project-count { flex: 0 0 auto; color: var(--text-muted); font-size: var(--sidebar-project-count-font-size); font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
.sidebar-project-unread { margin-left: auto; }
.sidebar-project-session-create { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.12s ease, color 0.12s ease, background 0.12s ease; }
.sidebar-project-session-create svg { width: 15px; height: 15px; }
.sidebar-project-session-create:hover { background: var(--sidebar-hover); color: var(--text-primary); }
.sidebar-project-header > .session-dots-btn { opacity: 0; }
.sidebar-project-header:hover > .sidebar-project-session-create,
.sidebar-project-header > .sidebar-project-session-create:focus-visible { opacity: 1; pointer-events: auto; }
.sidebar-project-header:hover > .session-dots-btn,
.sidebar-project-header > .session-dots-btn.menu-open,
.sidebar-project-header > .session-dots-btn:focus-visible { opacity: 1; }
@media (pointer: coarse) {
  .sidebar-project-header > .sidebar-project-session-create { opacity: 1; pointer-events: auto; }
  .sidebar-project-header > .session-dots-btn { opacity: 1; }
}
.sidebar-project-create { display: flex; align-items: center; gap: 4px; min-height: 36px; margin: 2px 4px 6px; padding: 3px 4px 3px 8px; border-radius: 8px; background: var(--bg-input-wrapper); }
.sidebar-project-create-icon { width: 15px; height: 15px; flex: 0 0 auto; color: var(--text-muted); }
.sidebar-project-create input[type="text"] { flex: 1; min-width: 0; height: 28px; padding: 0 4px; border: 0; border-radius: 0; background: transparent; color: var(--text-primary); font: inherit; font-size: 13px; outline: 0; box-shadow: none; }
.sidebar-project-create input[type="text"]:focus { border: 0; box-shadow: none; }
.sidebar-project-create-confirm, .sidebar-project-create-cancel { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; }
.sidebar-project-create-confirm svg, .sidebar-project-create-cancel svg { width: 15px; height: 15px; }
.sidebar-project-create-confirm:hover:not(:disabled), .sidebar-project-create-cancel:hover:not(:disabled) { background: var(--sidebar-hover); color: var(--text-primary); }
.sidebar-project-create-confirm:disabled, .sidebar-project-create-cancel:disabled { opacity: 0.4; cursor: default; }
.sidebar-project-sessions { padding-left: 17px; }
.sidebar-session-row { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding-top: 6px; padding-bottom: 6px; border: 0; background: transparent; color: var(--text-primary); text-align: left; }

              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 12 4 4L19 6"/></svg>
            </button>

              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m7 7 10 10M17 7 7 17"/></svg>
            </button>

              </button>
