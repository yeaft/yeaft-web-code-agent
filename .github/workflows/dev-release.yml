name: Dev Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Legacy image name for deployments that still pull the pre-rename package.
  LEGACY_IMAGE_NAME: ${{ github.repository_owner }}/claude-web-chat
  AGENT_IMAGE_NAME: ${{ github.repository }}-agent

jobs:
  # Resolve tag/commit for both push and workflow_dispatch triggers.
  # All downstream jobs reference outputs.tag / outputs.commit for consistency.
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve remote tag commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            RELEASE_COMMIT=$(sh scripts/verify-dev-release.sh resolve "$TAG")
          else
            TAG="$REF_NAME"
            RELEASE_COMMIT=$(git rev-parse --verify "${EVENT_SHA}^{commit}")
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Verify authoritative release refs
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: sh scripts/verify-dev-release.sh verify "$RELEASE_TAG" "$RELEASE_COMMIT"

  test:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run release guards
        run: npm run release:guard

      - name: Build frontend
        run: npm run build

  publish-agent:
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          VERSION=${RELEASE_TAG#v}
          cd agent && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Revalidate authoritative release refs
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: sh scripts/verify-dev-release.sh verify "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Publish to npm
        run: cd agent && npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate authoritative release refs for Server image
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: sh scripts/verify-dev-release.sh verify "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}:dev
          build-args: BUILD_VERSION=${{ needs.validate-tag.outputs.tag }}

      - name: Revalidate authoritative release refs for Agent image
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: sh scripts/verify-dev-release.sh verify "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:dev
          build-args: BUILD_VERSION=${{ needs.validate-tag.outputs.tag }}
