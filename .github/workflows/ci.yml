name: CI

on:
  # Disabled on pull_request by user request — was running on every PR push.
  # Keep workflow_dispatch so the job is still runnable manually from the
  # Actions tab when we want a full CI pass.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run release guards
        run: npm run release:guard

      - name: Build frontend
        run: npm run build

  work-item-attachments:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify native Work Item attachment lifecycle and ownership
        run: npm run test:focus -- test/agent/yeaft/work-center/attachment-platform.test.js

  browser-runtime-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Browser Runtime Windows ownership tests
        run: npm run test:focus -- test/agent/browser-runtime.test.js
