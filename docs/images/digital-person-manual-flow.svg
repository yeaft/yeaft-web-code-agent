<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1380" viewBox="0 0 1120 1380" role="img" aria-labelledby="title desc">
  <title id="title">数字人当前手动认知工作流</title>
  <desc id="desc">用户发送消息、点击思考或遐想，经 Server 鉴权中继和 Agent 的 MongoDB 准入后，组装短期上下文并调用模型。公开输出保存后校验提案。继续时可选择下一模型和只读能力；结束时原子提交当前认识。页面只读同步消息、思考记录和调试日志。失败、取消或预算耗尽不提交候选认识。没有自动唤醒。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526078"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Noto Sans CJK SC', sans-serif; fill: #17243b; }
      .title { font-size: 27px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .detail { font-size: 18px; fill: #42536c; }
      .small { font-size: 17px; fill: #42536c; }
      .box { fill: #fff; stroke: #9bacbf; stroke-width: 1.5; rx: 12; }
      .accent { fill: #edf4ff; stroke: #5781bd; stroke-width: 1.5; rx: 12; }
      .storage { fill: #edf7f2; stroke: #64967e; stroke-width: 1.5; rx: 12; }
      .line { fill: none; stroke: #526078; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1120" height="1380" rx="16" fill="#f7f9fc"/>
  <text class="title" x="560" y="45" text-anchor="middle">数字人如何完成一轮“想”</text>
  <text class="detail" x="560" y="77" text-anchor="middle">当前实现 · 一次操作 = Person Turn（episode）；内部多个认知 Loop</text>

  <rect class="accent" x="230" y="102" width="590" height="80"/>
  <text class="label" x="525" y="134" text-anchor="middle">1. 用户显式触发</text>
  <text class="detail" x="525" y="163" text-anchor="middle">发送消息 / Think 思考 / Dream 遐想</text>
  <path class="line" d="M525 182V211"/>
  <rect class="box" x="230" y="214" width="590" height="80"/>
  <text class="label" x="525" y="246" text-anchor="middle">2. Server 鉴权 → Agent</text>
  <text class="detail" x="525" y="275" text-anchor="middle">校验用户与 Agent 访问权，关联请求，不做推理</text>
  <path class="line" d="M525 294V323"/>
  <rect class="box" x="230" y="326" width="590" height="90"/>
  <text class="label" x="525" y="357" text-anchor="middle">3. MongoDB 准入</text>
  <text class="detail" x="525" y="386" text-anchor="middle">命令去重 · 忙检查 · 创建活动 / 租约 / 版本保护</text>
  <text class="small" x="525" y="407" text-anchor="middle">仅 Send 写用户消息；Think / Dream 保存为活动触发</text>
  <path class="line" d="M525 416V445"/>
  <rect class="box" x="230" y="448" width="590" height="90"/>
  <text class="label" x="525" y="481" text-anchor="middle">4. 组装 context：本次调用的短期记忆</text>
  <text class="detail" x="525" y="511" text-anchor="middle">Soul + 当前状态 + 触发 + 有界消息 / Concept + 能力结果</text>
  <path class="line" d="M525 538V567"/>
  <rect class="accent" x="230" y="570" width="590" height="90"/>
  <text class="label" x="525" y="603" text-anchor="middle">5. 模型承载 Person 的判断（一次 call）</text>
  <text class="detail" x="525" y="633" text-anchor="middle">产生结构化想法、判断、自判、状态提案与下一步</text>
  <path class="line" d="M525 660V689"/>
  <rect class="box" x="230" y="692" width="590" height="90"/>
  <text class="label" x="525" y="725" text-anchor="middle">6. 保存公开输出，校验提案</text>
  <text class="detail" x="525" y="755" text-anchor="middle">格式、读过的来源、事实 / 想象标记、版本、模型选择</text>
  <path class="line" d="M525 782V811"/>
  <rect class="box" x="230" y="814" width="590" height="70"/>
  <text class="label" x="525" y="856" text-anchor="middle">7. Runtime 按提案 next 分支：继续 / 提交</text>

  <path class="line" d="M230 848H115V777"/>
  <text class="small" x="145" y="836">继续</text>
  <rect class="accent" x="20" y="572" width="190" height="202"/>
  <text class="label" x="115" y="606" text-anchor="middle">下一次调用</text>
  <text class="detail" x="115" y="645" text-anchor="middle">自选模型 / effort</text>
  <text class="detail" x="115" y="678" text-anchor="middle">可选只读能力</text>
  <text class="small" x="115" y="714" text-anchor="middle">搜索 → 查看 → 使用</text>
  <text class="small" x="115" y="746" text-anchor="middle">候选还不是当前认识</text>
  <path class="line" d="M115 572V493H227"/>
  <path class="line" d="M525 884V923"/>
  <text class="small" x="542" y="910">结束：next = null</text>

  <rect class="storage" x="850" y="448" width="250" height="105"/>
  <text class="label" x="975" y="482" text-anchor="middle">MongoDB 长期记忆</text>
  <text class="small" x="975" y="513" text-anchor="middle">身份、消息、状态、Concept</text>
  <text class="small" x="975" y="538" text-anchor="middle">有界读取；省略 ≠ 删除</text>
  <path class="line dashed" d="M850 492H823"/>
  <rect class="storage" x="850" y="692" width="250" height="126"/>
  <text class="label" x="975" y="726" text-anchor="middle">持久认知记录</text>
  <text class="small" x="975" y="756" text-anchor="middle">每次输入、公开输出、能力</text>
  <text class="small" x="975" y="781" text-anchor="middle">候选 / 提交 / 终态与版本</text>
  <text class="small" x="975" y="805" text-anchor="middle">不保存模型隐藏推理</text>
  <path class="line dashed" d="M820 736H847"/>

  <rect class="storage" x="230" y="926" width="590" height="90"/>
  <text class="label" x="525" y="959" text-anchor="middle">8. MongoDB 原子提交</text>
  <text class="detail" x="525" y="989" text-anchor="middle">Concept 修订 + 当前状态 + 提交记录 + 可选回复</text>
  <path class="line" d="M525 1016V1045"/>
  <rect class="box" x="230" y="1048" width="590" height="65"/>
  <text class="label" x="525" y="1089" text-anchor="middle">9. 页面只读同步 → 等待下次人工操作</text>
  <path class="line" d="M525 1113V1136H187V1156"/>
  <path class="line" d="M525 1113V1156"/>
  <path class="line" d="M525 1113V1136H913V1156"/>
  <rect class="box" x="42" y="1160" width="290" height="72"/>
  <text class="label" x="187" y="1190" text-anchor="middle">消息</text>
  <text class="small" x="187" y="1217" text-anchor="middle">用户消息与已提交的对外回复</text>
  <rect class="accent" x="380" y="1160" width="290" height="72"/>
  <text class="label" x="525" y="1190" text-anchor="middle">思考记录</text>
  <text class="small" x="525" y="1217" text-anchor="middle">输入、记忆、想法、自判、采纳</text>
  <rect class="box" x="768" y="1160" width="290" height="72"/>
  <text class="label" x="913" y="1190" text-anchor="middle">调试日志</text>
  <text class="small" x="913" y="1217" text-anchor="middle">技术事件、请求参数、状态版本</text>

  <text class="detail" x="560" y="1280" text-anchor="middle">取消 / 失败 / 超时 / 调用耗尽：终止并记载结果，不提交候选认识</text>
  <text class="small" x="560" y="1312" text-anchor="middle">默认每轮最多 4 次模型调用、120 秒；重连 / 刷新 / 空闲不启动思考</text>
  <text class="small" x="560" y="1344" text-anchor="middle">Person 当前直接调用 adapter，不经 Engine.query；外部 VP / 自动唤醒尚未接入</text>
</svg>
