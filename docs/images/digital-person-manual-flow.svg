<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1380" viewBox="0 0 1120 1380" role="img" aria-labelledby="title desc">
  <title id="title">数字人当前 native 连续工具与最终认知工作流</title>
  <desc id="desc">用户显式 Send、Think 或 Dream，经 Server 鉴权和 Agent 认知库准入后，在同一个 Person、Soul 和 episode 中连续使用 native tools。每个执行请求提供完整可用 schemas，无需 catalog.view。模型完整响应归档后派发多个独立工具调用，各有 trace callId 与 modelCallId、toolUseId、toolIndex；原始成果存 trace，真实 tool role 延续对话，请求副本有界并保留 evidence receipts，通过 Execution.read 回读而不重放副作用。无工具 end_turn 后禁用 tools，请求一次 next:null 的最终认知 JSON，坏 JSON 或 sourceRefs 最多两次额外修正。通过校验后 SQLite 原子提交。公开进展绑定完整文本，不要求每 loop activity，模型 usage 只累计一次。主执行无累计调用或整轮时间额度，保留资源边界；32K 等小窗口 full tools 可能装不下，安全拒绝。暂停继续同一 episode 不重放，取消保留已执行成果且不保证回滚。不开启自动后台唤回，不创建 Session 或 WorkItem。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526078"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Noto Sans CJK SC', sans-serif; fill: #17243b; }
      .title { font-size: 27px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .detail { font-size: 18px; fill: #42536c; }
      .small { font-size: 17px; fill: #42536c; }
      .box { fill: #fff; stroke: #9bacbf; stroke-width: 1.5; rx: 12; }
      .accent { fill: #edf4ff; stroke: #5781bd; stroke-width: 1.5; rx: 12; }
      .storage { fill: #edf7f2; stroke: #64967e; stroke-width: 1.5; rx: 12; }
      .line { fill: none; stroke: #526078; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1120" height="1380" rx="16" fill="#f7f9fc"/>
  <text class="title" x="560" y="45" text-anchor="middle">数字人如何完成一轮“想”</text>
  <text class="detail" x="560" y="77" text-anchor="middle">显式触发 · 同一 Person / Soul / episode · 连续工具后一次最终认知</text>

  <rect class="accent" x="230" y="102" width="590" height="80"/>
  <text class="label" x="525" y="134" text-anchor="middle">1. 用户显式触发</text>
  <text class="detail" x="525" y="163" text-anchor="middle">发送消息 / Think 思考 / Dream 遐想</text>
  <path class="line" d="M525 182V211"/>
  <rect class="box" x="230" y="214" width="590" height="80"/>
  <text class="label" x="525" y="246" text-anchor="middle">2. Server 鉴权 → Agent</text>
  <text class="detail" x="525" y="275" text-anchor="middle">校验用户与 Agent 访问权，关联请求，不做推理</text>
  <path class="line" d="M525 294V323"/>
  <rect class="box" x="230" y="326" width="590" height="90"/>
  <text class="label" x="525" y="357" text-anchor="middle">3. 认知库准入（SQLite）</text>
  <text class="detail" x="525" y="386" text-anchor="middle">命令去重 · 忙检查 · 创建活动 / 租约 / 版本保护</text>
  <text class="small" x="525" y="407" text-anchor="middle">仅 Send 写用户消息；Think / Dream 保存为活动触发</text>
  <path class="line" d="M525 416V445"/>
  <rect class="box" x="230" y="448" width="590" height="90"/>
  <text class="label" x="525" y="481" text-anchor="middle">4. 组装 context：本次调用的短期记忆</text>
  <text class="detail" x="525" y="511" text-anchor="middle">Soul + 已接受状态 + 触发 + 有界消息 / Concept</text>
  <path class="line" d="M525 538V567"/>
  <rect class="accent" x="230" y="570" width="590" height="90"/>
  <text class="label" x="525" y="603" text-anchor="middle">5. Person 连续 native 对话（事务外）</text>
  <text class="detail" x="525" y="633" text-anchor="middle">每请求完整 tools schemas · 直接调用 · 无需 view</text>
  <path class="line" d="M525 660V689"/>
  <rect class="box" x="230" y="692" width="590" height="90"/>
  <text class="label" x="525" y="725" text-anchor="middle">6. 完整响应归档 → 校验 / 执行工具</text>
  <text class="detail" x="525" y="755" text-anchor="middle">原始成果存 Trace · 真实 tool role 返回 · usage 一次</text>
  <path class="line" d="M525 782V811"/>
  <rect class="accent" x="230" y="814" width="590" height="90"/>
  <text class="label" x="525" y="847" text-anchor="middle">7. tools 禁用：一次最终认知 JSON</text>
  <text class="small" x="525" y="878" text-anchor="middle">next:null · 坏 JSON / sourceRefs 最多 2 次额外修正</text>

  <path class="line" d="M230 736H213V794H115V777"/>
  <text class="small" x="28" y="815">tool_use：继续原对话</text>
  <rect class="accent" x="20" y="572" width="190" height="202"/>
  <text class="label" x="115" y="606" text-anchor="middle">工具结果延续</text>
  <text class="detail" x="115" y="645" text-anchor="middle">独立 trace callId</text>
  <text class="detail" x="115" y="678" text-anchor="middle">有界请求副本</text>
  <text class="small" x="115" y="714" text-anchor="middle">evidence receipts</text>
  <text class="small" x="115" y="746" text-anchor="middle">Execution.read 回读</text>
  <path class="line" d="M115 572V557H525V567"/>
  <text class="small" x="542" y="805">无工具 end_turn</text>
  <path class="line" d="M525 904V923"/>
  <text class="small" x="65" y="865">修正仍禁用 tools</text>
  <text class="small" x="65" y="892">绝不回放副作用</text>

  <rect class="storage" x="850" y="448" width="250" height="105"/>
  <text class="label" x="975" y="482" text-anchor="middle">person.db · 认知权威</text>
  <text class="small" x="975" y="513" text-anchor="middle">身份、消息、状态、Concept</text>
  <text class="small" x="975" y="538" text-anchor="middle">状态持久化；省略 ≠ 删除</text>
  <path class="line dashed" d="M850 492H823"/>
  <rect class="storage" x="850" y="570" width="250" height="105"/>
  <text class="label" x="975" y="600" text-anchor="middle">recall.db · 派生索引</text>
  <text class="small" x="975" y="628" text-anchor="middle">FTS5 + 向量 · worker 追平</text>
  <text class="small" x="975" y="655" text-anchor="middle">Recall 后回读当前 revision</text>
  <path class="line dashed" d="M975 553V567"/>
  <path class="line dashed" d="M850 616H835V518H823"/>
  <rect class="storage" x="850" y="692" width="250" height="126"/>
  <text class="label" x="975" y="726" text-anchor="middle">持久认知记录</text>
  <text class="small" x="975" y="756" text-anchor="middle">原始工具成果 / 完整文本</text>
  <text class="small" x="975" y="781" text-anchor="middle">父模型 / toolUseId / index</text>
  <text class="small" x="975" y="805" text-anchor="middle">进展绑定 complete text</text>
  <path class="line dashed" d="M820 736H847"/>

  <rect class="storage" x="230" y="926" width="590" height="90"/>
  <text class="label" x="525" y="959" text-anchor="middle">8. 权威库短事务原子提交</text>
  <text class="small" x="525" y="985" text-anchor="middle">Concept / state / episode / 回复 / Trace + memory_changes</text>
  <text class="small" x="525" y="1007" text-anchor="middle">同库提交 · lease / revision fence · 索引异步追平</text>
  <path class="line" d="M525 1016V1045"/>
  <rect class="box" x="230" y="1048" width="590" height="65"/>
  <text class="label" x="525" y="1089" text-anchor="middle">9. 页面只读同步 → 等待下次人工操作</text>
  <path class="line" d="M525 1113V1136H187V1156"/>
  <path class="line" d="M525 1113V1156"/>
  <path class="line" d="M525 1113V1136H913V1156"/>
  <rect class="box" x="42" y="1160" width="290" height="72"/>
  <text class="label" x="187" y="1190" text-anchor="middle">消息</text>
  <text class="small" x="187" y="1217" text-anchor="middle">用户消息、公开进展与最终回复</text>
  <rect class="accent" x="380" y="1160" width="290" height="72"/>
  <text class="label" x="525" y="1190" text-anchor="middle">思考记录</text>
  <text class="small" x="525" y="1217" text-anchor="middle">最终判断、自判与采纳状态</text>
  <rect class="box" x="768" y="1160" width="290" height="72"/>
  <text class="label" x="913" y="1190" text-anchor="middle">调试日志</text>
  <text class="small" x="913" y="1217" text-anchor="middle">技术事件、请求参数、状态版本</text>

  <text class="detail" x="560" y="1280" text-anchor="middle">暂停 / 继续同一 episode 不重放；取消保留已执行成果，不保证回滚</text>
  <text class="small" x="560" y="1312" text-anchor="middle">无主累计调用 / 整轮时限；保留资源边界；32K 小窗口 full tools 可能安全拒绝</text>
  <text class="small" x="560" y="1344" text-anchor="middle">无后台自动唤回 / Session / WorkItem 创建；执行链验证不保证真实模型质量</text>
</svg>
